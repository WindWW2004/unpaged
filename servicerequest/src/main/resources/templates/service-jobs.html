<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Service jobs')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="page-shell">
    <div th:replace="~{fragments/layout :: messages}"></div>
    <div class="page-heading">
        <div>
            <p class="eyebrow">Collections and search streams</p>
            <h1>Service jobs</h1>
            <p>Search by service code, VIN, or customer name.</p>
        </div>
        <a class="button" th:href="@{/jobs/request}">New request</a>
    </div>

    <section class="panel">
        <form class="search-bar" th:action="@{/jobs}" method="get">
            <label class="sr-only" for="query">Search service jobs</label>
            <input id="query" name="query" type="search" th:value="${query}" placeholder="Try ENG-1002 or a customer name">
            <button class="button button-secondary" type="submit">Search</button>
            <a class="text-link" th:if="${!query.isBlank()}" th:href="@{/jobs}">Clear</a>
        </form>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Code</th><th>Customer & vehicle</th><th>Service</th><th>Status</th><th>Estimate</th><th>Cost</th></tr>
                </thead>
                <tbody>
                <tr th:each="job : ${jobs}">
                    <td><a th:href="@{/jobs/{id}(id=${job.id})}" th:text="${job.serviceCode}">OIL-1000</a></td>
                    <td><strong th:text="${job.vehicle.owner.name}">Name</strong><small th:text="${job.vehicle.displayName}">Vehicle</small></td>
                    <td th:text="${job.serviceType.displayName}">Oil change</td>
                    <td><span class="status" th:classappend="${'status-' + job.status.name().toLowerCase()}" th:text="${job.status.displayName}">Requested</span></td>
                    <td th:text="${job.estimatedMinutes} + ' min'">30 min</td>
                    <td th:text="${#numbers.formatCurrency(job.calculateCost())}">$0.00</td>
                </tr>
                <tr th:if="${jobs.isEmpty()}"><td colspan="6" class="empty-state">No jobs match this search.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
