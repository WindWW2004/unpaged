<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Request service')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="page-shell narrow-shell">
    <div class="page-heading">
        <div>
            <p class="eyebrow">Validated intake form</p>
            <h1>Request vehicle service</h1>
            <p>Choose a service and provide the details used by its specialized Java class.</p>
        </div>
    </div>

    <form class="request-form" th:action="@{/jobs}" th:object="${serviceRequestForm}" method="post">
        <div class="validation-summary" th:if="${#fields.hasAnyErrors()}">
            Please correct the highlighted fields before submitting.
        </div>

        <section class="form-section">
            <div class="section-number">1</div>
            <div class="section-content">
                <h2>Customer</h2>
                <div class="form-grid">
                    <label class="span-2">Full name<input th:field="*{customerName}" autocomplete="name"><span class="field-error" th:errors="*{customerName}"></span></label>
                    <label>Email<input th:field="*{email}" type="email" autocomplete="email"><span class="field-error" th:errors="*{email}"></span></label>
                    <label>Phone<input th:field="*{phone}" autocomplete="tel" placeholder="555-010-1234"><span class="field-error" th:errors="*{phone}"></span></label>
                </div>
            </div>
        </section>

        <section class="form-section">
            <div class="section-number">2</div>
            <div class="section-content">
                <h2>Vehicle</h2>
                <div class="form-grid">
                    <label class="span-2">VIN <small>17 characters; I, O, and Q are excluded</small><input th:field="*{vin}" maxlength="17" placeholder="1HGCM82633A004352"><span class="field-error" th:errors="*{vin}"></span></label>
                    <label>License plate<input th:field="*{licensePlate}" maxlength="10"><span class="field-error" th:errors="*{licensePlate}"></span></label>
                    <label>Model year<input th:field="*{modelYear}" type="number" min="1980" max="2100"><span class="field-error" th:errors="*{modelYear}"></span></label>
                    <label>Make<input th:field="*{make}" placeholder="Toyota"><span class="field-error" th:errors="*{make}"></span></label>
                    <label>Model<input th:field="*{model}" placeholder="Camry"><span class="field-error" th:errors="*{model}"></span></label>
                </div>
            </div>
        </section>

        <section class="form-section">
            <div class="section-number">3</div>
            <div class="section-content">
                <h2>Service selection</h2>
                <div class="form-grid">
                    <label>Service type
                        <select th:field="*{serviceType}" id="serviceType">
                            <option value="">Choose a service</option>
                            <option th:each="type : ${serviceTypes}" th:value="${type}" th:text="${type.displayName}"></option>
                        </select>
                        <span class="field-error" th:errors="*{serviceType}"></span>
                    </label>
                    <label>Preferred mechanic <small>Optional</small>
                        <select th:field="*{mechanicId}">
                            <option value="">Assign later</option>
                            <option th:each="mechanic : ${mechanics}" th:value="${mechanic.id}" th:text="${mechanic.name + ' · ' + mechanic.specialty}"></option>
                        </select>
                    </label>
                    <label class="span-2">Appointment <small>Optional; blank requests enter the FIFO queue</small><input th:field="*{scheduledFor}" type="datetime-local"><span class="field-error" th:errors="*{scheduledFor}"></span></label>
                </div>

                <fieldset class="service-options" data-service="OIL_CHANGE">
                    <legend>Oil-change options</legend>
                    <div class="form-grid">
                        <label>Oil type<select th:field="*{oilType}"><option th:each="oil : ${oilTypes}" th:value="${oil}" th:text="${oil.displayName}"></option></select><span class="field-error" th:errors="*{oilType}"></span></label>
                        <label>Number of quarts<input th:field="*{numberOfQuarts}" type="number" min="3" max="16"><span class="field-error" th:errors="*{numberOfQuarts}"></span></label>
                        <label>Filter cost<input th:field="*{filterCost}" type="number" min="0" step="0.01"><span class="field-error" th:errors="*{filterCost}"></span></label>
                    </div>
                </fieldset>

                <fieldset class="service-options" data-service="TIRE_SERVICE">
                    <legend>Tire-service options</legend>
                    <div class="form-grid">
                        <label>Number of tires<input th:field="*{numberOfTires}" type="number" min="1" max="8"><span class="field-error" th:errors="*{numberOfTires}"></span></label>
                        <div class="checkbox-group span-2">
                            <label><input th:field="*{rotation}" type="checkbox"> Rotation</label>
                            <label><input th:field="*{balancing}" type="checkbox"> Balancing</label>
                            <label><input th:field="*{alignment}" type="checkbox"> Alignment</label>
                        </div>
                    </div>
                </fieldset>

                <fieldset class="service-options" data-service="ENGINE_REPAIR">
                    <legend>Engine-repair options</legend>
                    <div class="form-grid">
                        <label>Diagnostic hours<input th:field="*{diagnosticHours}" type="number" min="0.25" step="0.25"><span class="field-error" th:errors="*{diagnosticHours}"></span></label>
                        <label>Labor rate<input th:field="*{laborRate}" type="number" min="1" step="0.01"><span class="field-error" th:errors="*{laborRate}"></span></label>
                        <label>Estimated parts cost<input th:field="*{partsCost}" type="number" min="0" step="0.01"><span class="field-error" th:errors="*{partsCost}"></span></label>
                        <label>Complexity<select th:field="*{complexity}"><option th:each="level : ${complexities}" th:value="${level}" th:text="${level.displayName}"></option></select><span class="field-error" th:errors="*{complexity}"></span></label>
                    </div>
                </fieldset>
            </div>
        </section>

        <div class="form-actions">
            <a class="text-link" th:href="@{/jobs}">Cancel</a>
            <button class="button" type="submit">Submit service request</button>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
    const selector = document.querySelector('#serviceType');
    const optionGroups = document.querySelectorAll('[data-service]');
    function showSelectedOptions() {
        optionGroups.forEach(group => group.hidden = group.dataset.service !== selector.value);
    }
    selector.addEventListener('change', showSelectedOptions);
    showSelectedOptions();
</script>
</body>
</html>
